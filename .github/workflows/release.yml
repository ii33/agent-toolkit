name: release

# 推 v* 标签即自动创建 GitHub Release，并附上 npm pack 产物。
# 说明优先取 release-notes/<tag>.md；没有就退回 GitHub 自动生成。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pack bundle
        id: pack
        run: |
          set -euo pipefail
          file="$(npm pack --silent | tail -n 1)"
          echo "file=${file}" >> "$GITHUB_OUTPUT"
          ls -la "$file"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.file }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="release-notes/${tag}.md"
          args=(--title "$tag" --verify-tag)
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          gh release create "$tag" "${args[@]}" "$TARBALL"
