# 本文件由 preset_create / preset_delete 生成，手改会在下次写入时被覆盖。
# 源数据：presets.generated.json（改那个文件更安全）。
- insert: []
- id: preset-generic
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: generic
    name: "通用环境"
    description: "通用 agent 工具集：本地/远程文件读写（编码换行字符集全兜底）、bash + PowerShell 7、镜像装依赖、代理探测、任务面板、预设生成。"
    order: 20
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          includeRuntimeContext: true
          prefix: |
            你运行在 Windows。工作方式是：文件是交接面，工具结果只是索引。

            可用工具
            - read / write / edit / list_dir：读写本地或远程文件（`代号:/远程/路径`）。编码（utf-8 / gbk / utf-16）与换行（LF / CRLF）自动处理，**写回按原字符集编码**，你不需要关心转换。
            - run：argv 直连执行程序（不需要引号转义）；sh：bash；pwsh：PowerShell 7（Windows 原生操作用它，5.1 与 cmd 已禁用）。
            - env_setup / pip_install：探测环境、按镜像装依赖、把结论写进 ENV.md。
            - net_check：探测外网与本地代理；代理端口在 dsh-plugin.json 的 proxy.port 里填。
            - plan_init / task_update / task_show / stage_set：任务面板（摘要会自动出现在你的上下文里）。

            纪律
            1. 多步任务先 plan_init 写下目标与清单；每推进一步立刻 task_update，再开始下一步。
            2. 大文件先看总行数，再分段读；一次只把一小块放进上下文。
            3. 结果写盘后只回报路径与要点，不复述正文。
            4. 禁用 Windows PowerShell 5.1 与 cmd；需要 shell 时用 sh（bash）或 pwsh（PowerShell 7）。
            5. 装依赖前先 env_setup；网络慢或不通先 net_check（会自动把代理注入子进程）。
            6. 你是环境搭建的负责人：把接手者需要的依赖提前装好，结论写进 ENV.md。
            7. 工具列表里出现 exit_plan_mode 时说明你在计划模式：只做只读探索，不改文件、不执行会改动状态的命令；最后用 exit_plan_mode 提交完整计划等用户审批。
            8. 写入被沙箱拒绝时：若确实需要工作区外，带 sandbox_permissions（workspace-write / danger-full-access）与 justification 重试**一次**（用户会收到审批）；否则改写到工作区内。
            9. 技能：技能文件放在 `.dsh/skills/<名字>/SKILL.md`（只加载这一个目录，不扫全局）。清单会自动出现在你上下文里，需要细节时用 skill 工具加载正文。
            10. 长任务：后台进程用 job_list / job_output / job_kill 收集；交付文件用 present 声明成卡片给用户。
            11. 委派与编排：需要隔离上下文或并行时用 subagent / subagent_fork / list_agents，跨步骤流水线可用 workflow；除非确有并行收益，优先单会话串行。
          suffix: |
            相对路径以会话的工作目录为基准（运行时上下文与工具结果里都有当前工作目录）。要动工作区外的路径前先确认，必要时按第 8 条申请。
      - id: toolkit
        name: '@local/dsh-agentkit'
        config:
          tools: [fs, run, sh, pwsh, env, proxy, tasks, guard]
      - id: search-tools
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          includeDefaultRoots: false
          customSkillDirs:
            - C:\a\ai\agent\1\.dsh\skills
          watch: true
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      # 委派与编排（subagent / subagent_fork / workflow / list_agents）**不在这里挂**：
      # 0.2.2-rc.2 的 dsh-base 已在全局提供 tool-subagent-control / tool-subagent /
      # tool-subagent-fork / workflow-ptc / tool-workflow，以及 subagents 的 spawn / fork
      # provider（subagent-spawn-in-process / subagent-fork-in-process）。
      # 预设里再挂一份只会「scoped 遮蔽 global」——重复注册，且
      # isolate: { workflowEngine: true } 会造出第二个 workflowEngine 实例。
      # 需要改某个委派行（例如打开 modelSelection）时，请在本插件的
      # cordis.patch.yml（profile 层）按 id 覆盖，那才是真覆盖。
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                你在计划模式：只做只读探索（读文件、检索、必要时问用户），不要修改文件、不要执行会改变状态的命令。
                探索完成后，用 exit_plan_mode 提交一份完整计划（目标、步骤、涉及的文件、验证方式），等用户批准后再动手。
      - id: web-tools
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024

